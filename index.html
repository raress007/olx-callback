<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>OLX conectare</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #666; --box: #f3f3f3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --box: #222; } }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: auto; }
  code { display: block; padding: 12px; background: var(--box); border-radius: 8px; word-break: break-all; font-size: 13px; }
  button { margin-top: 12px; padding: 10px 18px; font-size: 16px; border-radius: 8px; border: 0; background: #0a7; color: #fff; cursor: pointer; }
  p.small { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1 id="h">OLX conectare</h1>
  <p id="msg">Copiază linkul de mai jos și lipește-l în terminal.</p>
  <code id="url"></code>
  <button id="copy">Copiază</button>
  <p class="small">Această pagină nu salvează și nu trimite nimic nicăieri. Codul nu funcționează fără cheia secretă a aplicației, care rămâne pe calculator.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const urlBox = document.getElementById("url");
  if (q.get("error")) {
    document.getElementById("h").textContent = "Conectare refuzată";
    document.getElementById("msg").textContent = "OLX a răspuns cu o eroare: " + q.get("error") + (q.get("error_description") ? " — " + q.get("error_description") : "");
  } else if (!q.get("code")) {
    document.getElementById("msg").textContent = "Nu există niciun cod în link. Pornește conectarea din terminal.";
  }
  urlBox.textContent = location.href;
  document.getElementById("copy").onclick = async () => {
    await navigator.clipboard.writeText(location.href);
    document.getElementById("copy").textContent = "Copiat ✓";
  };
</script>
</body>
</html>
